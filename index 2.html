<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finn's RepVault</title><style>
*{box-sizing:border-box}html{background:#000}body{margin:0;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.94);border-bottom:1px solid #222}.head{max-width:1600px;margin:auto;padding:22px 28px 12px;display:grid;grid-template-columns:360px 1fr 250px;gap:28px;align-items:center}.brand{font-size:34px;font-weight:850;letter-spacing:-1.5px}.blue{color:#67c8ff}.tag{font-size:14px;margin-top:4px;color:#ddd}.search{height:54px;border-radius:17px;border:1px solid #333;background:#101012;color:#fff;padding:0 20px;outline:none;width:100%}.search:focus{border-color:#67c8ff}.right{display:flex;justify-content:flex-end;gap:24px;color:#eee}.nav{max-width:1600px;margin:auto;padding:0 28px;display:flex;gap:38px}.nav button{padding:15px 8px;background:none;border:0;color:#eee;cursor:pointer;border-bottom:3px solid transparent}.nav button.active{color:#67c8ff;border-color:#67c8ff}.layout{max-width:1600px;margin:auto;padding:22px 28px 50px;display:grid;grid-template-columns:265px 1fr;gap:20px}.side{display:flex;flex-direction:column;gap:14px}.panel{background:#0d0d0e;border:1px solid #2a2a2d;border-radius:14px;padding:16px}.panel h3{margin:0 0 13px;color:#67c8ff;font-size:16px}.filter{width:100%;display:flex;justify-content:space-between;gap:10px;padding:8px 5px;background:none;border:0;color:#eee;text-align:left;cursor:pointer}.filter.active{color:#67c8ff;background:#0d2230;border-radius:8px}.muted{color:#999}.price{width:100%;accent-color:#67c8ff}.mainhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.mainhead h2{margin:0;font-size:20px}.sort{background:#111;border:1px solid #29292c;color:#fff;border-radius:10px;padding:10px 12px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.card{background:#0b0b0c;border:1px solid #242427;border-radius:12px;overflow:hidden;min-width:0}.pic{aspect-ratio:1/1;background:linear-gradient(145deg,#111,#080808);display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain;padding:10px}.placeholder{color:#3a3a3f;font-size:12px;text-align:center;padding:20px}.info{padding:12px}.name{font-weight:700;font-size:14px;line-height:1.25;min-height:35px}.section{font-size:12px;color:#999;margin-top:4px}.priceText{color:#67c8ff;font-weight:800;margin-top:8px}.empty{padding:80px 0;text-align:center;color:#888}.status{font-size:12px;color:#777;margin-top:8px}.mobileFilters{display:none}
@media(max-width:1250px){.grid{grid-template-columns:repeat(4,1fr)}.head{grid-template-columns:300px 1fr}.right{display:none}}@media(max-width:900px){.head{display:flex;flex-wrap:wrap;padding:16px}.brand{font-size:27px}.search{order:3;flex-basis:100%;height:48px}.nav{padding:0 16px;gap:18px;overflow:auto}.layout{display:block;padding:16px}.side{display:none}.mobileFilters{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.mobileFilters button{white-space:nowrap;background:#111;border:1px solid #2a2a2d;color:#fff;border-radius:999px;padding:8px 12px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.pic img{padding:5px}.mainhead{align-items:flex-start;gap:10px}.mainhead h2{font-size:18px}.sort{max-width:130px}}
</style></head><body><header class="top"><div class="head"><div><div class="brand">Finn's <span class="blue">RepVault</span></div><div class="tag">More finds. Less overpay.</div></div><input id="search" class="search" placeholder="Search for products or keywords..."><div class="right"><span>♡ Favorites</span><span>▢ Catalog</span></div></div><nav class="nav" id="nav"><button class="active" data-section="all">All Products</button><button data-section="PC Version ">PC Version</button><button data-section="Budget finds ">Budget Finds</button><button data-section="New Arrivals">New Finds</button><button data-section="More Finds">More Finds</button></nav></header><main class="layout"><aside class="side"><div class="panel"><h3>Categories</h3><div id="cats"></div></div><div class="panel"><h3>Price Range</h3><input id="range" class="price" type="range" min="10" max="200" value="200"><div class="status">Up to $<span id="rangeVal">200</span></div></div><div class="panel"><h3>Images</h3><div class="status">Online spreadsheet images load automatically. Some “More Finds” images were embedded in Excel and still need separate hosting.</div></div></aside><section><div class="mobileFilters" id="mobileCats"></div><div class="mainhead"><h2><span id="count">0</span> Products</h2><select id="sort" class="sort"><option value="default">Sort: Default</option><option value="low">Price: Low</option><option value="high">Price: High</option><option value="az">Name: A–Z</option></select></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>No products match your filters.</div></section></main><script>
let data=[],section='all',category='All';const $=s=>document.querySelector(s),grid=$('#grid'),search=$('#search'),range=$('#range'),sort=$('#sort');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cats=['All','Tops','Bottoms','Outerwear','Shoes','Accessories','Other'];
function buildCats(){const counts={};cats.forEach(c=>counts[c]=c==='All'?data.length:data.filter(x=>x.type===c).length);const html=cats.map(c=>`<button class="filter ${c===category?'active':''}" data-cat="${c}"><span>${c}</span><span class="muted">${counts[c]}</span></button>`).join('');$('#cats').innerHTML=html;$('#mobileCats').innerHTML=cats.map(c=>`<button data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;buildCats();render()})}
function render(){let q=search.value.trim().toLowerCase(),max=+range.value;let rows=data.filter(x=>(section==='all'||x.section===section)&&(category==='All'||x.type===category)&&(!q||x.name.toLowerCase().includes(q)||x.type.toLowerCase().includes(q)||x.category.toLowerCase().includes(q))&&(x.price==null||x.price<=max));if(sort.value==='low')rows.sort((a,b)=>(a.price??1e9)-(b.price??1e9));if(sort.value==='high')rows.sort((a,b)=>(b.price??-1)-(a.price??-1));if(sort.value==='az')rows.sort((a,b)=>a.name.localeCompare(b.name));$('#count').textContent=rows.length;$('#empty').hidden=rows.length>0;grid.innerHTML=rows.slice(0,1600).map(x=>`<article class="card"><div class="pic">${x.image?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(x.image)}" alt="${esc(x.name)}" onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Image unavailable</div>'">`:'<div class="placeholder">Image coming soon</div>'}</div><div class="info"><div class="name">${esc(x.name)}</div><div class="section">${esc(x.type)} · ${esc(x.section.trim())}</div><div class="priceText">${x.price!=null?'$'+Number(x.price).toFixed(2):esc(x.priceText||'')}</div></div></article>`).join('')}
search.oninput=render;range.oninput=()=>{$('#rangeVal').textContent=range.value;render()};sort.onchange=render;document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');section=b.dataset.section;render()});fetch('data.json').then(r=>r.json()).then(d=>{data=d;buildCats();render()}).catch(()=>{$('#empty').hidden=false;$('#empty').textContent='Could not load data.json';});
</script></body></html>
